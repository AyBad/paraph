appId: com.aybad.paraph
name: Profils (nom unique, 5 gratuits)
---
- runFlow: commun/demarrage.yaml
- tapOn: "Modifier"
- tapOn: "Nouveau profil"
# the name field shows "Nom du profil" when empty
- tapOn: "Nom du profil"
- inputText: "moi"
- hideKeyboard
- tapOn: "Enregistrer"
- assertVisible: "Ce nom de profil existe déjà.*"
- takeScreenshot: captures/03-nom-deja-utilise
- tapOn: "moi"
- eraseText: 5
- inputText: "Sarah"
- hideKeyboard
- tapOn: "Enregistrer"
- assertVisible: "Sarah"
# up to 5 profiles
- tapOn: "Nouveau profil"
- tapOn: "Nom du profil"
- inputText: "Profil 3"
- hideKeyboard
- tapOn: "Enregistrer"
- assertVisible: "Profil 3"
- tapOn: "Nouveau profil"
- tapOn: "Nom du profil"
- inputText: "Profil 4"
- hideKeyboard
- tapOn: "Enregistrer"
- assertVisible: "Profil 4"
- tapOn: "Nouveau profil"
- tapOn: "Nom du profil"
- inputText: "Profil 5"
- hideKeyboard
- tapOn: "Enregistrer"
- assertVisible: "Profil 5"
# the 6th asks for the Pro version
- tapOn: "Nouveau profil"
- assertVisible: ".*5 profils.*"
- takeScreenshot: captures/04-limite-5-profils
- tapOn: "Annuler"
