# Shared: fresh start of the app, through the opening animation and the introduction
appId: com.aybad.paraph
---
- launchApp:
    clearState: true
# an emulator can be slow: first start of the WebView + 5 s opening animation
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: captures/00-lancement
- extendedWaitUntil:
    visible: "Passer|Skip"
    timeout: 90000
- takeScreenshot: captures/01-presentation
- tapOn: "Passer|Skip"
- tapOn:
    text: "Autoriser|Suivant|Commencer|Allow|Next|Get started"
    optional: true
- tapOn:
    text: "Plus tard|Later"
    optional: true
- tapOn:
    text: "Plus tard|Later"
    optional: true
- extendedWaitUntil:
    visible: "Ouvrir un document|Open a document"
    timeout: 10000
