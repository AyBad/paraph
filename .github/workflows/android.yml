name: Build Android APK
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Paraph.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Paraph-apk
          path: Paraph.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-b${{ github.run_number }}
          name: Paraph Android – build ${{ github.run_number }}
          body: |
            APK de test Paraph (build ${{ github.run_number }}, commit ${{ github.sha }}).
            Lien permanent vers la dernière version : https://github.com/${{ github.repository }}/releases/latest/download/Paraph.apk
          files: Paraph.apk
          make_latest: true
